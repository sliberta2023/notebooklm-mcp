[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notebooklm-mcp"
version = "0.1.0"
description = "MCP server for Google NotebookLM – list notebooks, query sources, add documents, and generate artifacts via any MCP client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "sliberta2023", email = "" }]
keywords = ["mcp", "notebooklm", "google", "ai", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "notebooklm-py[browser]>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/sliberta2023/notebooklm-mcp"
Repository = "https://github.com/sliberta2023/notebooklm-mcp"
Issues = "https://github.com/sliberta2023/notebooklm-mcp/issues"
Changelog = "https://github.com/sliberta2023/notebooklm-mcp/blob/main/CHANGELOG.md"

[project.scripts]
notebooklm-mcp = "notebooklm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["notebooklm_mcp"]

# ---------------------------------------------------------------------------
# Ruff – linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Mypy – static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Dev dependencies (install with: pip install -e ".[dev]")
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
